<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Synthesizer</title>
<style>
  body { margin: 0; background: #0d0d0f; color: #ddd; font-family: system-ui, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; letter-spacing: .1em; color: #e8b86a; }
  section { border: 1px solid #2a2a30; border-radius: 8px; padding: 12px; margin-bottom: 12px; }
  h2 { font-size: 13px; color: #888; margin: 0 0 8px; }
  .row { display: flex; align-items: center; gap: 8px; margin: 6px 0; }
  .row .name { width: 90px; }
  .row .val { width: 90px; text-align: right; font-variant-numeric: tabular-nums; color: #e8b86a; }
  button { background: #1c1c22; color: #ddd; border: 1px solid #3a3a44; border-radius: 6px;
           padding: 6px 10px; font-size: 14px; cursor: pointer; }
  button.on { background: #6b4a1a; border-color: #e8b86a; }
  button.flash { background: #e8b86a; color: #000; }
  kbd { font-size: 11px; color: #999; margin-left: 4px; border: 1px solid #555; border-radius: 3px; padding: 0 3px; }
  button.flash kbd { color: #000; border-color: #000; }
  #play { width: 100%; font-size: 18px; padding: 12px; }
  #help { display: none; font-size: 13px; color: #aaa; }
  #help.show { display: block; }
</style>
</head>
<body>
<main>
  <h1>DRONE SYNTHESIZER</h1>

  <section>
    <button id="play" data-act="play">▶ 再生 / 停止<kbd>Space</kbd></button>
  </section>

  <section>
    <h2>声部（ON/OFF）</h2>
    <div class="row">
      <button data-act="v0">低音（-1oct）<kbd>1</kbd></button>
      <button data-act="v1">基音<kbd>2</kbd></button>
      <button data-act="v2">5度<kbd>3</kbd></button>
      <button data-act="v3">オクターブ<kbd>4</kbd></button>
    </div>
  </section>

  <section>
    <h2>音程・音色</h2>
    <div class="row"><span class="name">基音</span>
      <button data-act="root-">−<kbd>←</kbd></button><button data-act="root+">＋<kbd>→</kbd></button>
      <span class="val" id="v-root"></span></div>
    <div class="row"><span class="name">オクターブ</span>
      <button data-act="oct-">−<kbd>Z</kbd></button><button data-act="oct+">＋<kbd>X</kbd></button>
      <span class="val" id="v-oct"></span></div>
    <div class="row"><span class="name">波形</span>
      <button data-act="wave">切替<kbd>V</kbd></button>
      <span class="val" id="v-wave"></span></div>
  </section>

  <section>
    <h2>つまみ</h2>
    <div id="knobs"></div>
  </section>

  <section>
    <button data-act="help">ショートカット一覧<kbd>/</kbd></button>
    <div id="help"></div>
  </section>
</main>

<script>
// ===== 設定 =====
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WAVES = ['sawtooth','triangle','square','sine'];
const VOICE_RATIOS = [0.5, 1, 1.5, 2];          // 低音・基音・5度・オクターブ

// つまみ: [キー名, 表示名, 下げるキー, 上げるキー, 最小, 最大, 初期値, 1回の変化量, 単位]
const KNOBS = [
  ['cutoff', 'フィルター',  'A', 'Q', 60,  8000, 900,  1.15, 'Hz'],
  ['reso',   '共鳴',        'S', 'W', 0,   25,   4,    1,    ''],
  ['detune', 'うなり',      'D', 'E', 0,   30,   7,    1,    'cent'],
  ['lfoRate','揺れ速さ',    'F', 'R', 0.02,5,    0.1,  1.3,  'Hz'],
  ['lfoAmt', '揺れ深さ',    'G', 'T', 0,   3000, 400,  100,  'Hz'],
  ['reverb', '残響',        'H', 'Y', 0,   1,    0.5,  0.05, ''],
  ['volume', '音量',        '↓', '↑', 0,   1,    0.5,  0.05, ''],
];

// ===== 状態 =====
const st = { playing: false, root: 2, oct: 2, wave: 0, voices: [true, true, true, false] };
KNOBS.forEach(k => st[k[0]] = k[6]);

// ===== 音の仕組み =====
let ac, filter, lfo, lfoGain, dry, wet, master, voices = [];

function makeReverb() {
  const len = ac.sampleRate * 5, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  const conv = ac.createConvolver(); conv.buffer = buf; return conv;
}

function setupAudio() {
  ac = new AudioContext();
  filter = ac.createBiquadFilter(); filter.type = 'lowpass';
  lfo = ac.createOscillator(); lfoGain = ac.createGain();
  lfo.connect(lfoGain).connect(filter.frequency); lfo.start();
  dry = ac.createGain(); wet = ac.createGain(); master = ac.createGain();
  master.gain.value = 0;
  const rev = makeReverb();
  filter.connect(dry).connect(master);
  filter.connect(rev).connect(wet).connect(master);
  master.connect(ac.destination);

  voices = VOICE_RATIOS.map(() => {
    const g = ac.createGain(); g.gain.value = 0; g.connect(filter);
    const oscs = [0, 1].map(() => { const o = ac.createOscillator(); o.connect(g); o.start(); return o; });
    return { g, oscs };
  });
  applyAll();
}

function baseFreq() { return 440 * Math.pow(2, (st.root + 12 * (st.oct + 1) - 69) / 12); }

function applyAll() {
  if (!ac) return;
  const t = ac.currentTime, f = baseFreq();
  voices.forEach((v, i) => {
    v.oscs.forEach((o, j) => {
      o.type = WAVES[st.wave];
      o.frequency.setTargetAtTime(f * VOICE_RATIOS[i], t, 0.3);   // ゆっくり音程移動
      o.detune.setTargetAtTime(j ? st.detune : -st.detune, t, 0.1);
    });
    v.g.gain.setTargetAtTime(st.voices[i] ? 0.2 : 0, t, 0.8);      // ふわっと出入り
  });
  filter.frequency.setTargetAtTime(st.cutoff, t, 0.1);
  filter.Q.setTargetAtTime(st.reso, t, 0.1);
  lfo.frequency.setTargetAtTime(st.lfoRate, t, 0.1);
  lfoGain.gain.setTargetAtTime(st.lfoAmt, t, 0.1);
  dry.gain.setTargetAtTime(1 - st.reverb * 0.7, t, 0.1);
  wet.gain.setTargetAtTime(st.reverb * 1.5, t, 0.1);
  master.gain.setTargetAtTime(st.playing ? st.volume : 0, t, st.playing ? 1 : 0.5);
}

// ===== 操作 =====
const ACTIONS = {
  play()  { if (!ac) setupAudio(); st.playing = !st.playing; ac.resume(); },
  'root-'() { st.root = (st.root + 11) % 12; },
  'root+'() { st.root = (st.root + 1) % 12; },
  'oct-'()  { st.oct = Math.max(0, st.oct - 1); },
  'oct+'()  { st.oct = Math.min(5, st.oct + 1); },
  wave()  { st.wave = (st.wave + 1) % WAVES.length; },
  help()  { document.getElementById('help').classList.toggle('show'); },
};
[0, 1, 2, 3].forEach(i => ACTIONS['v' + i] = () => st.voices[i] = !st.voices[i]);

KNOBS.forEach(([key, , , , min, max, , step]) => {
  const mul = step > 1 && max > 100 && key !== 'lfoAmt';         // 周波数系は掛け算で変化
  ACTIONS[key + '-'] = () => st[key] = Math.max(min, mul ? st[key] / step : st[key] - step);
  ACTIONS[key + '+'] = () => st[key] = Math.min(max, mul ? st[key] * step : st[key] + step);
});

// キー → 操作
const KEYMAP = {
  Space: 'play', Digit1: 'v0', Digit2: 'v1', Digit3: 'v2', Digit4: 'v3',
  ArrowLeft: 'root-', ArrowRight: 'root+', KeyZ: 'oct-', KeyX: 'oct+', KeyV: 'wave', Slash: 'help',
};
const codeOf = k => k === '↑' ? 'ArrowUp' : k === '↓' ? 'ArrowDown' : 'Key' + k;
KNOBS.forEach(([key, , down, up]) => { KEYMAP[codeOf(down)] = key + '-'; KEYMAP[codeOf(up)] = key + '+'; });

function run(act) {
  ACTIONS[act](); applyAll(); render();
  const b = document.querySelector(`[data-act="${act}"]`);
  if (b) { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 120); }
}

// ===== 画面 =====
document.getElementById('knobs').innerHTML = KNOBS.map(([key, name, down, up]) =>
  `<div class="row"><span class="name">${name}</span>
   <button data-act="${key}-">−<kbd>${down}</kbd></button><button data-act="${key}+">＋<kbd>${up}</kbd></button>
   <span class="val" id="v-${key}"></span></div>`).join('');

// ショートカット一覧（全ボタンから自動で作る）
document.getElementById('help').innerHTML = [...document.querySelectorAll('button[data-act]')].map(b => {
  const label = b.closest('.row')?.querySelector('.name')?.textContent || '';
  return `<div>${b.querySelector('kbd').outerHTML} ${label} ${b.firstChild.textContent}</div>`;
}).join('');

function render() {
  const fmt = (v, u) => (v < 10 ? v.toFixed(2) : Math.round(v)) + ' ' + u;
  document.getElementById('v-root').textContent = NOTE_NAMES[st.root];
  document.getElementById('v-oct').textContent = st.oct;
  document.getElementById('v-wave').textContent = WAVES[st.wave];
  KNOBS.forEach(([key, , , , , , , , unit]) => document.getElementById('v-' + key).textContent = fmt(st[key], unit));
  [0, 1, 2, 3].forEach(i => document.querySelector(`[data-act="v${i}"]`).classList.toggle('on', st.voices[i]));
  document.getElementById('play').classList.toggle('on', st.playing);
}

document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => run(b.dataset.act));
document.addEventListener('keydown', e => {
  const act = KEYMAP[e.code];
  if (!act || e.repeat && act === 'play') return;
  e.preventDefault(); run(act);
});
render();
</script>
</body>
</html>
