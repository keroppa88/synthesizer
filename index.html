<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Synthesizer</title>
<style>
  :root { --bg: #0d0d0f; --panel: #141418; --line: #2a2a30; --btn: #1c1c22; --acc: #e8b86a; --accd: #6b4a1a; --txt: #ddd; --sub: #888; }
  body { -webkit-tap-highlight-color: transparent; margin: 0; background: var(--bg); color: var(--txt); font-family: system-ui, sans-serif; }
  main { max-width: 1100px; margin: 0 auto; padding: 12px 16px; }
  section { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; margin-bottom: 10px; overflow-x: auto; }
  section.dim { opacity: .35; }
  h2 { font-size: 12px; color: var(--sub); margin: 0 0 8px; font-weight: normal; }
  h2 b { color: var(--acc); }
  .hint { font-size: 11px; color: #666; }

  button { background: var(--btn); color: var(--txt); border: 1px solid #3a3a44; border-radius: 6px;
           padding: 6px 4px; font-size: 13px; cursor: pointer; }
  button.on { background: var(--accd); border-color: var(--acc); }
  button.rec.on { background: #8a1c1c; border-color: #ff6060; }
  button.flash { background: var(--acc); color: #000; }
  kbd { display: block; font-size: 13px; font-weight: bold; color: #fff; }
  button.flash kbd { color: #000; }
  .val { font-size: 12px; color: var(--acc); font-variant-numeric: tabular-nums; min-height: 1.2em; }
  .name { font-size: 11px; color: #aaa; }

  /* ① 再生バー */
  .transport { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
  .transport .item { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 64px; }
  .transport .lcd { background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 6px 12px;
                    font-variant-numeric: tabular-nums; color: var(--acc); font-size: 18px; min-width: 150px; text-align: center; }
  .transport .lcd small { display: block; font-size: 10px; color: var(--sub); }
  .spacer { flex: 1; }

  /* ② トラック＋録音内容 */
  .trow { display: flex; gap: 8px; margin-bottom: 4px; align-items: stretch; }
  .thead { width: 190px; flex: none; display: grid; grid-template-columns: 44px 1fr; gap: 2px 6px; align-items: center;
           background: var(--btn); border: 1px solid #3a3a44; border-radius: 6px; padding: 4px 6px; cursor: pointer; }
  .thead.sel { border-color: #fff; box-shadow: 0 0 0 1px #fff; }
  .thead button { grid-row: span 2; padding: 4px 2px; }
  .thead .tname { font-size: 12px; }
  .thead .tinfo { font-size: 11px; color: var(--sub); display: flex; gap: 6px; align-items: center; }
  .badge { font-size: 11px; border-radius: 3px; padding: 1px 6px; background: #222; color: #888; border: 1px solid #3a3a44; }
  .badge.on { background: var(--accd); color: #fff; border-color: var(--acc); }
  .badge.mode { color: #ccc; }
  .badge kbd { display: inline; font-size: 10px; margin-right: 3px; }
  .meter { grid-column: 1 / 3; height: 4px; background: #222; border-radius: 2px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--acc); }
  .tl { position: relative; flex: 1; min-width: 560px; min-height: 48px; border-radius: 4px; background-color: #101014; }
  .ev { position: absolute; height: 20px; background: var(--accd); border: 1px solid var(--acc); border-radius: 3px;
        font-size: 12px; line-height: 20px; padding: 0 4px; overflow: hidden; white-space: nowrap; box-sizing: border-box; }
  .ev span { outline: none; cursor: text; }
  .ev.bad { background: #8a1c1c; }
  .ph { position: absolute; top: 0; bottom: 0; width: 2px; background: #fff; opacity: .6; pointer-events: none; }

  /* ③ 音色：キーボードと同じ10列 */
  .grid { display: grid; grid-template-columns: repeat(10, minmax(70px, 1fr)); gap: 4px 6px; }
  .group { grid-row: 1; font-size: 11px; color: var(--acc); border-bottom: 1px solid var(--accd); padding-bottom: 2px; letter-spacing: .1em; }
  .col { grid-row: 2; display: flex; flex-direction: column; gap: 3px; text-align: center; }
  .switches { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; }
  .switches .sw { display: flex; flex-direction: column; align-items: center; gap: 2px; min-width: 72px; }
  .switches .sw button, .transport .item button { width: 100%; }
  .switches .sep { width: 1px; background: var(--line); margin: 0 4px; }
  .layer { margin-top: 8px; }
  .layer + .layer { border-top: 1px dashed var(--line); padding-top: 8px; }

  /* ④ 鍵盤：上段（黒鍵）を半キー左にずらす */
  .piano { display: grid; grid-template-columns: repeat(34, minmax(18px, 1fr)); gap: 6px 0; }
  .pk { margin: 0 2px; height: 60px; overflow: hidden; padding: 4px 0; font-size: 12px; display: flex; flex-direction: column; justify-content: space-between; }
  .pk.white { background: #e9e6df; color: #111; border-color: #999; height: 80px; }
  .pk.white kbd { color: #111; }
  .pk.black { background: #111; border-color: #555; }
  .pk.oct { background: #2a2a34; }
  .pk.down { background: var(--acc) !important; color: #000; }
  .pk { touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }

  /* スマホ：鍵盤を画面幅に収めて、画面の下に固定 */
  @media (max-width: 700px) {
    #pianoSec { position: sticky; bottom: 0; z-index: 10; margin: 0 -16px; border-radius: 0;
                padding: 6px 4px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -4px 12px #000; }
    #pianoSec h2 { margin-bottom: 4px; }
    .piano { grid-template-columns: repeat(34, minmax(0, 1fr)); gap: 4px 0; }
    .pk { margin: 0 1px; padding: 2px 0; height: 52px; font-size: 9px; letter-spacing: -.03em; }
    .pk.white { height: 72px; }
    .pk kbd { font-size: 10px; }
  }

  #help { display: none; font-size: 12px; color: #aaa; margin-top: 8px; columns: 3; }
  #help.show { display: block; }
</style>
</head>
<body>
<main>

  <!-- ① 再生バー -->
  <section>
    <div class="transport" id="transport"></div>
    <div id="help"></div>
  </section>

  <!-- ② トラック＋録音内容 -->
  <section>
    <h2>トラック　<span class="hint">Z〜N 選択／6 ON・OFF／7 音階／BS 録音消去　｜　棒の文字をクリックして書き換えると音が変わる（ド→ミ、Am→D、空で削除）</span></h2>
    <div id="trackArea"></div>
  </section>

  <!-- ③ 音色 -->
  <section>
    <h2>音色（<b class="h-track"></b>）</h2>
    <div class="switches" id="switches"></div>
    <div class="layer"><div class="grid" id="knobs"></div></div>
    <div class="layer"><div class="grid" id="sknobs"></div></div>
  </section>

  <!-- ④ 鍵盤 -->
  <section id="pianoSec">
    <h2>鍵盤（<b class="h-track"></b>）<b id="h-pmode"></b>　<span id="v-poct"></span></h2>
    <div class="piano" id="piano"></div>
  </section>
</main>

<script>
// ===== 設定 =====
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const CHORD_NAMES = ['C','Db','D','Eb','E','F','F#','G','Ab','A','Bb','B'];   // コード名は♭表記
const SOL = ['ド','ド#','レ','レ#','ミ','ファ','ファ#','ソ','ソ#','ラ','ラ#','シ'];
const WAVES = ['sawtooth','triangle','square','sine'];
const VOICE_RATIOS = [0.5, 1, 1.5, 2];          // 低音・基音・5度・オクターブ
const TRACK_KEYS = ['Z', 'X', 'C', 'V', 'B', 'N'];
const MODES = ['ドローン', '鍵盤', 'コード'];
const QUANTS = [['なし', 0], ['1/4', 1], ['1/8', 0.5], ['1/16', 0.25]];   // 拍単位
const BARS = [1, 2, 4, 8];
const ARPS = ['なし', '上昇', '下降', '上下', 'ランダム'];
const ARP_RATES = [['1/4', 1], ['1/8', 0.5], ['1/16', 0.25], ['1/32', 0.125]];

// 再生バー: [キー, 操作名, 表示名]
const TRANSPORT = [
  ['0', 'play',  '再生/停止'],
  ['-', 'rec',   '録音'],
  ['^', 'bars',  '小節数'],
  ['8', 'quant', 'クォンタイズ'],
  ['Tab', 'pmode', '演奏モード'],
  ['9', 'help',  '一覧'],
];
// 音色の切替: [キー, 操作名, 表示名]。'|' は区切り
const SWITCHES = [
  ['1', 'v0', '低音'], ['2', 'v1', '基音'], ['3', 'v2', '5度'], ['4', 'v3', 'オクターブ'], ['5', 'wave', '波形'],
  '|',
  ['⇧1', 'mono', '単音/和音'], ['⇧2', 'arp', 'アルペジオ'], ['⇧3', 'arpRate', 'アルペジオ速さ'],
];

// つまみ: [キー名, 表示名, 上げるキー, 下げるキー, 最小, 最大, 初期値, 1回の変化量, 単位]
// 変化量が 1より大きく2未満 → 掛け算で変化（周波数・時間系）
// Shift なし：音の流れ順（音源 → フィルター → 出力）
const KNOBS = [
  ['root',    '基音',           'Q', 'A', 0,     11,   2,    1,    ''],
  ['oct',     'オクターブ',     'W', 'S', 0,     5,    2,    1,    ''],
  ['detune',  'うなり',         'E', 'D', 0,     30,   7,    1,    'cent'],
  ['sub',     'サブ音',         'R', 'F', 0,     1,    0,    0.05, ''],
  ['noise',   'ノイズ',         'T', 'G', 0,     1,    0,    0.05, ''],
  ['cutoff',  'フィルター',     'Y', 'H', 60,    8000, 900,  1.15, 'Hz'],
  ['reso',    '共鳴',           'U', 'J', 0,     25,   4,    1,    ''],
  ['filtEnv', 'フィルター動き', 'I', 'K', 0,     6000, 0,    200,  'Hz'],
  ['reverb',  '残響',           'O', 'L', 0,     1,    0.5,  0.05, ''],
  ['volume',  '音量',           'P', ';', 0,     1,    0.5,  0.05, ''],
];
// Shift あり：音量の山 → ピッチ → 揺れ → 全体
const SKNOBS = [
  ['attack',  '立ち上がり',     'Q', 'A', 0.005, 4,    0.06, 1.4,  's'],
  ['decay',   '減衰',           'W', 'S', 0.01,  4,    0.3,  1.4,  's'],
  ['sustain', '持続',           'E', 'D', 0,     1,    1,    0.05, ''],
  ['release', '余韻',           'R', 'F', 0.05,  8,    1.2,  1.4,  's'],
  ['porta',   'ポルタメント',   'T', 'G', 0,     2,    0,    0.05, 's'],
  ['vibDepth','ビブラート深さ', 'Y', 'H', 0,     100,  0,    5,    'cent'],
  ['vibRate', 'ビブラート速さ', 'U', 'J', 0.5,   12,   5,    1.2,  'Hz'],
  ['lfoRate', '揺れ速さ',       'I', 'K', 0.02,  5,    0.1,  1.3,  'Hz'],
  ['lfoAmt',  '揺れ深さ',       'O', 'L', 0,     3000, 400,  100,  'Hz'],
  ['tempo',   'テンポ',         'P', ';', 40,    200,  70,   2,    'BPM'],   // テンポだけ全トラック共通
];
// 見出し: [表示名, 開始列, 列数]
const GROUPS  = [['音源', 1, 5], ['フィルター', 6, 3], ['出力', 9, 2]];
const SGROUPS = [['音量の山', 1, 4], ['ピッチ', 5, 3], ['揺れ', 8, 2], ['全体', 10, 1]];

// ===== 鍵盤（演奏モード）=====
// 下段：A=オクターブ下げ、S〜L=白鍵、;=オクターブ上げ。上段：E R Y U I=黒鍵
const WHITE = { S: 0, D: 2, F: 4, G: 5, H: 7, J: 9, K: 11, L: 12 };   // C からの半音数
const BLACK = { E: 1, R: 3, Y: 6, U: 8, I: 10 };

// コード：基音のキー（ナチュラルマイナー）のダイアトニック
const MINOR = [0, 2, 3, 5, 7, 8, 10];
const deg = i => MINOR[i % 7] + 12 * Math.floor(i / 7);
const triad = i => [deg(i), deg(i + 2), deg(i + 4)];
const CHORDS = {
  S: triad(0), D: triad(1), F: triad(2), G: triad(3), H: triad(4), J: triad(5), K: triad(6), L: triad(7),
  E: [0, 2, 7],      // I sus2
  R: [1, 5, 8],      // ♭II（砂漠っぽい響き）
  Y: [5, 9, 12],     // IV メジャー
  U: [7, 11, 14],    // V メジャー
  I: [0, 4, 7],      // I メジャー
};
const CHORD_Q = { '': [0,4,7], m: [0,3,7], dim: [0,3,6], aug: [0,4,8], sus2: [0,2,7], sus4: [0,5,7],
                  '7': [0,4,7,10], m7: [0,3,7,10], maj7: [0,4,7,11] };

// ===== 状態 =====
function newTrack(i) {
  const t = { on: i === 0, wave: 0, voices: [true, true, true, false], mode: 0, events: [],
              mono: false, arp: 0, arpRate: 1 };
  [...KNOBS, ...SKNOBS].forEach(k => { if (k[0] !== 'tempo') t[k[0]] = k[6]; });
  return t;
}
const tracks = TRACK_KEYS.map((_, i) => newTrack(i));
const st = { playing: false, sel: 0, tempo: 70, quant: 2, bars: 1, rec: false, playMode: false, playOct: 3, loopStart: 0 };
const cur = () => tracks[st.sel];                 // いま操作中のトラック
const tgt = key => key === 'tempo' ? st : cur();  // つまみの対象

// ===== 保存（ブラウザに残す）=====
const SAVE_KEY = 'drone-synth-v1';
function save() {
  try {
    localStorage.setItem(SAVE_KEY, JSON.stringify(
      { tracks, tempo: st.tempo, quant: st.quant, bars: st.bars, sel: st.sel, playOct: st.playOct }));
  } catch (e) {}
}
function load() {
  try {
    const d = JSON.parse(localStorage.getItem(SAVE_KEY));
    if (!d) return;
    d.tracks.forEach((t, i) => tracks[i] && Object.assign(tracks[i], t));
    ['tempo', 'quant', 'bars', 'sel', 'playOct'].forEach(k => { if (d[k] !== undefined) st[k] = d[k]; });
  } catch (e) {}
}
load();

// ===== 音の名前 ⇔ 音 =====
// 録音する1音（またはコード）は { pos, dur, kind:'note', semi, oct } か { pos, dur, kind:'chord', root, q, oct }
const labelOf = ev => ev.kind === 'chord' ? CHORD_NAMES[ev.root] + ev.q : SOL[ev.semi] + ev.oct;
const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
function notesOf(ev) {
  if (ev.kind === 'note') return [12 * (ev.oct + 1) + ev.semi];
  const base = 12 * (ev.oct + 1) + ev.root;
  return [base - 12, ...CHORD_Q[ev.q].map(x => base + x)];      // 1オクターブ下にルートを足す
}
const toKatakana = s => s.replace(/[ぁ-ゖ]/g, c => String.fromCharCode(c.charCodeAt(0) + 0x60));
const LETTER = { C: 0, D: 2, E: 4, F: 5, G: 7, A: 9, B: 11 };

function parseNote(text, oct) {
  const m = toKatakana(text).replace(/[ー\s]/g, '').replace(/♯/g, '#').match(/^(.+?)(\d)?$/);
  if (!m) return null;
  let semi = SOL.indexOf(m[1]);
  const L = m[1].match(/^([A-Ga-g])([#b♭]?)$/);
  if (semi < 0 && L) semi = (LETTER[L[1].toUpperCase()] + (L[2] === '#' ? 1 : L[2] ? -1 : 0) + 12) % 12;
  if (semi < 0) return null;
  return { kind: 'note', semi, oct: m[2] !== undefined ? +m[2] : oct };
}
function parseChord(text, oct) {
  const m = text.replace(/\s/g, '').replace(/♯/g, '#').replace(/♭/g, 'b').match(/^([A-Ga-g])([#b]?)(.*)$/);
  if (!m || !(m[3] in CHORD_Q)) return null;
  const root = (LETTER[m[1].toUpperCase()] + (m[2] === '#' ? 1 : m[2] ? -1 : 0) + 12) % 12;
  return { kind: 'chord', root, q: m[3], oct };
}
function chordQ(iv) {
  const r = iv.map(x => x - iv[0]).join();
  return Object.keys(CHORD_Q).find(q => CHORD_Q[q].join() === r) ?? '';
}

// 鍵盤は2オクターブ（C から数えた半音 0〜24）。PCキーは下の1オクターブ（0〜12）だけ
const KEY_OF_SEMI = {};                              // 半音 → PCキー（コードの割り当てにも使う）
Object.entries({ ...WHITE, ...BLACK }).forEach(([k, s]) => KEY_OF_SEMI[s] = k);
const pcToId = k => k === 'A' || k === ';' ? k : (WHITE[k] ?? BLACK[k]) !== undefined ? String(WHITE[k] ?? BLACK[k]) : null;

// 鍵盤（半音の番号）→ 鳴らすもの
function descFor(id, tr) {
  const s = +id;
  if (isNaN(s)) return null;
  const up = Math.floor(s / 12);                     // 何オクターブ上か
  if (tr.mode === 1) return { kind: 'note', semi: s % 12, oct: st.playOct + up };
  if (tr.mode === 2) {
    const iv = CHORDS[KEY_OF_SEMI[s % 12]].map(x => x + 12 * up), r = tr.root + iv[0];
    return { kind: 'chord', root: r % 12, q: chordQ(iv), oct: st.playOct + Math.floor(r / 12) };
  }
  return null;
}

// ===== 音の仕組み =====
let ac, master, reverbIn, noiseBuf, nodes = [];

function makeReverb() {
  const len = ac.sampleRate * 5, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  const conv = ac.createConvolver(); conv.buffer = buf; return conv;
}

// 1トラック分：ドローン（声部4つ＋サブ音＋ノイズ）／メロディー → フィルター → 出口 → (そのまま / 残響へ)
function makeTrackNodes() {
  const n = {
    filter: ac.createBiquadFilter(), lfo: ac.createOscillator(), lfoGain: ac.createGain(),
    out: ac.createGain(), dry: ac.createGain(), send: ac.createGain(),
    sub: ac.createOscillator(), subG: ac.createGain(), noise: ac.createBufferSource(), noiseG: ac.createGain(),
  };
  n.filter.type = 'lowpass';
  n.lfo.connect(n.lfoGain).connect(n.filter.frequency); n.lfo.start();
  n.out.gain.value = 0;
  n.filter.connect(n.out);
  n.out.connect(n.dry).connect(master);
  n.out.connect(n.send).connect(reverbIn);
  n.voices = VOICE_RATIOS.map(() => {
    const g = ac.createGain(); g.gain.value = 0; g.connect(n.filter);
    const oscs = [0, 1].map(() => { const o = ac.createOscillator(); o.connect(g); o.start(); return o; });
    return { g, oscs };
  });
  n.sub.type = 'sine'; n.subG.gain.value = 0; n.sub.connect(n.subG).connect(n.filter); n.sub.start();
  n.noise.buffer = noiseBuf; n.noise.loop = true; n.noiseG.gain.value = 0;
  n.noise.connect(n.noiseG).connect(n.filter); n.noise.start();
  return n;
}

function setupAudio() {
  if (ac) return;
  ac = new AudioContext();
  master = ac.createGain(); master.gain.value = 0.6; master.connect(ac.destination);
  reverbIn = makeReverb(); reverbIn.connect(master);
  noiseBuf = ac.createBuffer(1, ac.sampleRate * 2, ac.sampleRate);
  noiseBuf.getChannelData(0).forEach((_, i, d) => d[i] = Math.random() * 2 - 1);
  nodes = tracks.map(makeTrackNodes);
  applyAll();
  setInterval(() => { schedule(); liveArp(); }, 25);
}

function applyTrack(tr, n) {
  const t = ac.currentTime;
  const f = 440 * Math.pow(2, (tr.root + 12 * (tr.oct + 1) - 69) / 12);
  const drone = st.playing && tr.mode === 0;                       // ドローンは再生中＆ドローン音階のときだけ
  n.voices.forEach((v, i) => {
    v.oscs.forEach((o, j) => {
      o.type = WAVES[tr.wave];
      o.frequency.setTargetAtTime(f * VOICE_RATIOS[i], t, 0.3);   // ゆっくり音程移動
      o.detune.setTargetAtTime(j ? tr.detune : -tr.detune, t, 0.1);
    });
    v.g.gain.setTargetAtTime(drone && tr.voices[i] ? 0.2 : 0, t, 0.8);   // ふわっと出入り
  });
  n.sub.frequency.setTargetAtTime(f / 2, t, 0.3);
  n.subG.gain.setTargetAtTime(drone ? tr.sub * 0.3 : 0, t, 0.8);
  n.noiseG.gain.setTargetAtTime(drone ? tr.noise * 0.15 : 0, t, 0.8);
  n.filter.frequency.setTargetAtTime(tr.cutoff, t, 0.1);
  n.filter.Q.setTargetAtTime(tr.reso, t, 0.1);
  n.lfo.frequency.setTargetAtTime(tr.lfoRate, t, 0.1);
  n.lfoGain.gain.setTargetAtTime(tr.lfoAmt, t, 0.1);
  n.dry.gain.setTargetAtTime(1 - tr.reverb * 0.7, t, 0.1);
  n.send.gain.setTargetAtTime(tr.reverb * 1.5, t, 0.1);
  n.out.gain.setTargetAtTime(tr.on ? tr.volume : 0, t, 0.3);
}

function applyAll() {
  if (!ac) return;
  tracks.forEach((tr, i) => applyTrack(tr, nodes[i]));
}

// ===== メロディーの1音（またはコード）=====
// 音源（波形2本＋サブ音＋ノイズ）→ 音ごとのフィルター → 音量の山（ADSR）→ トラックの出口
const rt = tracks.map(() => ({ last: null, mono: null }));   // 直前の音程（ポルタメント用）と単音モードの音

function voiceOn(ti, midis, t) {
  const tr = tracks[ti], n = nodes[ti];
  if (tr.mono && rt[ti].mono) voiceOff(rt[ti].mono, t, true);     // 単音：前の音をすぐ切る

  const filt = ac.createBiquadFilter(), amp = ac.createGain(), srcs = [];
  const tcDecay = tr.decay / 3 + 0.001;
  // フィルター動き：弾いた瞬間に開いて、減衰の速さで元に戻る
  filt.type = 'lowpass'; filt.Q.value = tr.reso;
  filt.frequency.setValueAtTime(Math.min(18000, tr.cutoff + tr.filtEnv), t);
  filt.frequency.setTargetAtTime(tr.cutoff, t + tr.attack, tcDecay);
  n.lfoGain.connect(filt.frequency);                               // トラックの「揺れ」も効かせる
  filt.connect(amp).connect(n.out);

  // 音量の山：立ち上がり → 減衰 → 持続
  const peak = 0.25 / Math.sqrt(midis.length);
  amp.gain.setValueAtTime(0, t);
  amp.gain.linearRampToValueAtTime(peak, t + tr.attack);
  amp.gain.setTargetAtTime(peak * tr.sustain, t + tr.attack, tcDecay);

  // ビブラート
  const vib = ac.createOscillator(), vibG = ac.createGain();
  vib.frequency.value = tr.vibRate; vibG.gain.value = tr.vibDepth;
  vib.connect(vibG); vib.start(t); srcs.push(vib);

  const prev = rt[ti].last;
  midis.forEach((m, i) => {
    // ポルタメント：直前の音程から滑ってくる
    const from = tr.porta > 0 && prev ? prev[Math.min(i, prev.length - 1)] : m;
    const osc = (type, mm, det, dest) => {
      const o = ac.createOscillator();
      o.type = type;
      o.frequency.setValueAtTime(mtof(from + mm - m), t);
      if (from !== m) o.frequency.exponentialRampToValueAtTime(mtof(mm), t + tr.porta);
      o.detune.value = det; vibG.connect(o.detune);
      o.connect(dest); o.start(t); srcs.push(o);
    };
    [-1, 1].forEach(s => osc(WAVES[tr.wave], m, s * tr.detune, filt));
    if (tr.sub > 0) {                                              // サブ音：1オクターブ下のサイン波
      const sg = ac.createGain(); sg.gain.value = tr.sub; sg.connect(filt);
      osc('sine', m - 12, 0, sg);
    }
  });
  if (tr.noise > 0) {                                              // ノイズ：風・息の成分
    const ns = ac.createBufferSource(), ng = ac.createGain();
    ns.buffer = noiseBuf; ns.loop = true; ng.gain.value = tr.noise * 0.5;
    ns.connect(ng).connect(filt); ns.start(t); srcs.push(ns);
  }

  rt[ti].last = midis;
  const v = { ti, filt, amp, srcs, rel: tr.release };
  if (tr.mono) rt[ti].mono = v;
  return v;
}
function voiceOff(v, t, fast) {
  if (v.off !== undefined && v.off <= t) return;                   // もっと早く止める予定がある
  v.off = t;
  const g = v.amp.gain;
  if (g.cancelAndHoldAtTime) g.cancelAndHoldAtTime(t); else g.cancelScheduledValues(t);
  const tc = fast ? 0.02 : v.rel / 3 + 0.001;                      // 余韻
  g.setTargetAtTime(0, t, tc);
  const end = t + tc * 8;
  v.srcs.forEach(s => { try { s.stop(end); } catch (e) {} });
  setTimeout(() => { try { nodes[v.ti].lfoGain.disconnect(v.filt.frequency); } catch (e) {} },
             (end - ac.currentTime) * 1000 + 300);
}

// アルペジオ：コードの音を順番に鳴らす
function arpSeq(midis, mode) {
  const s = [...midis].sort((a, b) => a - b);
  if (mode === 2) return s.reverse();
  if (mode === 3) return s.concat(s.slice(1, -1).reverse());
  return s;
}
const arpPick = (seq, i, mode) => mode === 4 ? seq[Math.floor(Math.random() * seq.length)] : seq[i % seq.length];
const arpStep = tr => ARP_RATES[tr.arpRate][1] * beatSec();

// 決まった長さの音を鳴らす（ループ再生用）
function playEvent(ti, midis, t, dur) {
  const tr = tracks[ti];
  if (tr.arp && midis.length > 1) {
    const step = arpStep(tr), seq = arpSeq(midis, tr.arp);
    for (let i = 0; t + i * step < t + dur - 1e-4; i++) {
      const s = t + i * step;
      voiceOff(voiceOn(ti, [arpPick(seq, i, tr.arp)], s), Math.min(s + step * 0.9, t + dur));
    }
  } else voiceOff(voiceOn(ti, midis, t), t + dur);
}
function click(t, accent) {                                         // 録音中のメトロノーム
  const o = ac.createOscillator(), g = ac.createGain();
  o.frequency.value = accent ? 1600 : 1000;
  g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.05);
  o.connect(g).connect(ac.destination); o.start(t); o.stop(t + 0.06);
}

// ===== ループ再生（少し先まで予約していく）=====
const beatSec = () => 60 / st.tempo;
const loopBeats = () => BARS[st.bars] * 4;
let schedUntil = 0;
function schedule() {
  if (!st.playing) return;
  const now = ac.currentTime, a = Math.max(schedUntil, now), b = now + 0.15;
  if (b <= a) return;
  const beat = beatSec(), Lb = loopBeats(), L = Lb * beat;
  for (let k = Math.floor((a - st.loopStart) / L); k <= Math.floor((b - st.loopStart) / L); k++) {
    const t0 = st.loopStart + k * L;
    tracks.forEach((tr, ti) => tr.events.forEach(ev => {
      if (ev.skip === k || ev.pos >= Lb) return;                    // 録ったばかりの周回は鳴らさない
      const t = t0 + ev.pos * beat;
      if (t >= a && t < b) playEvent(ti, notesOf(ev), t, ev.dur * beat);
    }));
    if (st.rec) for (let i = 0; i < Lb; i++) {
      const t = t0 + i * beat;
      if (t >= a && t < b) click(t, i % 4 === 0);
    }
  }
  schedUntil = b;
}

// ===== 演奏 =====
const held = {};                                    // 押している鍵盤キー → 鳴っている音
function pianoDown(k) {
  if (k === 'A') { st.playOct = Math.max(0, st.playOct - 1); return; }
  if (k === ';') { st.playOct = Math.min(6, st.playOct + 1); return; }
  const desc = descFor(k, cur());
  if (!desc || held[k]) return;
  setupAudio(); ac.resume();
  if (!cur().on) { cur().on = true; applyAll(); }   // OFF のトラックで弾いたら自動で ON
  const now = ac.currentTime, tr = cur(), midis = notesOf(desc);
  const x = { t0: now, desc, ti: st.sel, rec: st.rec, midis };
  if (tr.arp && midis.length > 1) { x.arp = arpSeq(midis, tr.arp); x.i = 0; x.next = now; liveArp(); }
  else x.v = voiceOn(st.sel, midis, now);
  held[k] = x;
}
function pianoUp(k) {
  const x = held[k];
  if (!x) return;
  delete held[k];
  if (x.v) voiceOff(x.v, ac.currentTime);
  if (x.rec && st.rec) recordNote(x, ac.currentTime);
}
// 押している間のアルペジオを少し先まで予約
function liveArp() {
  const b = ac.currentTime + 0.1;
  Object.values(held).forEach(x => {
    if (!x.arp) return;
    const tr = tracks[x.ti], step = arpStep(tr);
    while (x.next < b) {
      voiceOff(voiceOn(x.ti, [arpPick(x.arp, x.i, tr.arp)], x.next), x.next + step * 0.9);
      x.i++; x.next += step;
    }
  });
}
function releaseAll() { Object.keys(held).forEach(pianoUp); }

// 弾いた音を、クォンタイズしてループに書き込む
function recordNote(x, tEnd) {
  const beat = beatSec(), Lb = loopBeats(), q = QUANTS[st.quant][1];
  const toBeat = t => (t - st.loopStart) / beat;
  const qz = b => q ? Math.round(b / q) * q : b;
  const s = qz(toBeat(x.t0));
  let e = qz(toBeat(tEnd));
  if (e - s < (q || 0.1)) e = s + (q || 0.1);
  const k = Math.floor(s / Lb);
  tracks[x.ti].events.push({ ...x.desc, pos: s - k * Lb, dur: e - s, skip: k });
  tracks[x.ti].events.sort((a, b) => a.pos - b.pos);
  save(); renderTimeline();
}

// ===== 操作 =====
function setTempo(v) {
  v = Math.max(40, Math.min(200, v));
  if (ac && st.playing) {                           // 曲の位置を保ったままテンポを変える
    const now = ac.currentTime, pb = (now - st.loopStart) / beatSec();
    st.loopStart = now - pb * 60 / v;
  }
  st.tempo = v;
}

const ACTIONS = {
  play()  {
    setupAudio(); ac.resume();
    st.playing = !st.playing;
    if (st.playing) { st.loopStart = ac.currentTime + 0.05; schedUntil = 0; }
    else st.rec = false;
  },
  rec()     { if (!st.playing) ACTIONS.play(); st.rec = !st.rec; },
  quant()   { st.quant = (st.quant + 1) % QUANTS.length; },
  bars()    { st.bars = (st.bars + 1) % BARS.length; renderTimeline(); },
  help()    { document.getElementById('help').classList.toggle('show'); },
  pmode()   { releaseAll(); st.playMode = !st.playMode; },
  clear()   { cur().events = []; renderTimeline(); },
  track()   { cur().on = !cur().on; },
  mode()    { releaseAll(); cur().mode = (cur().mode + 1) % MODES.length; },
  wave()    { cur().wave = (cur().wave + 1) % WAVES.length; },
  mono()    { cur().mono = !cur().mono; },
  arp()     { cur().arp = (cur().arp + 1) % ARPS.length; },
  arpRate() { cur().arpRate = (cur().arpRate + 1) % ARP_RATES.length; },
};
[0, 1, 2, 3].forEach(i => ACTIONS['v' + i] = () => cur().voices[i] = !cur().voices[i]);
TRACK_KEYS.forEach((_, i) => {
  ACTIONS['sel' + i] = () => { releaseAll(); st.sel = i; renderTimeline(); };
  ACTIONS['on' + i] = () => tracks[i].on = !tracks[i].on;                        // 見出しの ON/OFF ボタン
  ACTIONS['mode' + i] = () => { releaseAll(); tracks[i].mode = (tracks[i].mode + 1) % MODES.length; };
});
ACTIONS.track = () => ACTIONS['on' + st.sel]();     // 6 キー
ACTIONS.mode = () => ACTIONS['mode' + st.sel]();    // 7 キー

[...KNOBS, ...SKNOBS].forEach(([key, , , , min, max, , step]) => {
  const mul = step > 1 && step < 2;
  ACTIONS[key + '+'] = () => tgt(key)[key] = Math.min(max, mul ? tgt(key)[key] * step : tgt(key)[key] + step);
  ACTIONS[key + '-'] = () => tgt(key)[key] = Math.max(min, mul ? tgt(key)[key] / step : tgt(key)[key] - step);
});
// 基音は B の次が C に戻る（ぐるっと一周）
ACTIONS['root+'] = () => cur().root = (cur().root + 1) % 12;
ACTIONS['root-'] = () => cur().root = (cur().root + 11) % 12;
ACTIONS['tempo+'] = () => setTempo(st.tempo + 2);
ACTIONS['tempo-'] = () => setTempo(st.tempo - 2);

// キー → 操作
const codeOf = k => k === ';' ? 'Semicolon' : k === '-' ? 'Minus' : k === '^' ? 'Equal' : k === 'Tab' ? 'Tab'
                  : /\d/.test(k) ? 'Digit' + k : 'Key' + k;
const keyOf = code => code === 'Semicolon' ? ';' : code.startsWith('Key') ? code.slice(3) : null;
const KEYMAP = { Space: 'play', Backspace: 'clear', Digit6: 'track', Digit7: 'mode' };
const SHIFTMAP = {};
TRANSPORT.forEach(([k, act]) => KEYMAP[codeOf(k)] = act);
SWITCHES.forEach(s => {
  if (s === '|') return;
  const [k, act] = s;
  if (k[0] === '⇧') SHIFTMAP[codeOf(k.slice(1))] = act; else KEYMAP[codeOf(k)] = act;
});
KNOBS.forEach(([key, , up, down]) => { KEYMAP[codeOf(up)] = key + '+'; KEYMAP[codeOf(down)] = key + '-'; });
SKNOBS.forEach(([key, , up, down]) => { SHIFTMAP[codeOf(up)] = key + '+'; SHIFTMAP[codeOf(down)] = key + '-'; });
TRACK_KEYS.forEach((k, i) => KEYMAP[codeOf(k)] = 'sel' + i);

function run(act) {
  ACTIONS[act](); applyAll(); render(); save();
  const alias = act === 'track' ? 'on' + st.sel : act === 'mode' ? 'mode' + st.sel : act;   // 6・7 キーは見出しのボタンを光らせる
  document.querySelectorAll(`[data-act="${alias}"]`).forEach(b => {
    b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 120);
  });
}

// ===== 画面 =====
const btn = (act, key, label, cls = '') =>
  `<button class="${cls}" data-act="${act}"><kbd>${key}</kbd>${label}</button>`;

// ① 再生バー
document.getElementById('transport').innerHTML =
  TRANSPORT.slice(0, 2).map(([k, act, n]) =>
    `<div class="item">${btn(act, k, n, act === 'rec' ? 'rec' : '')}<span class="val" id="t-${act}"></span></div>`).join('') +
  `<div class="lcd"><span id="pos">1.1</span><small id="lcdsub"></small></div>` +
  `<div class="item">${btn('tempo-', '⇧;', '−')}<span class="name">テンポ</span></div>
   <div class="item">${btn('tempo+', '⇧P', '＋')}<span class="val" id="t-tempo"></span></div>` +
  TRANSPORT.slice(2, 4).map(([k, act, n]) =>
    `<div class="item">${btn(act, k, n)}<span class="val" id="t-${act}"></span></div>`).join('') +
  `<div class="spacer"></div>` +
  TRANSPORT.slice(4).map(([k, act, n]) =>
    `<div class="item">${btn(act, k, n)}<span class="val" id="t-${act}"></span></div>`).join('');

// ③ 音色：切替
document.getElementById('switches').innerHTML = SWITCHES.map(s => s === '|' ? '<div class="sep"></div>' :
  `<div class="sw">${btn(s[1], s[0], s[2])}<span class="val" id="t-${s[1]}"></span></div>`).join('');

// ③ 音色：つまみ（見出し＋10列）
const knobGrid = (list, groups, pre) =>
  groups.map(([n, c, w]) => `<div class="group" style="grid-column:${c}/span ${w}">${n}</div>`).join('') +
  list.map(([key, name, up, down], i) =>
    `<div class="col" style="grid-column:${i + 1}">
       ${btn(key + '+', pre + up, '＋')}
       <span class="name">${name}</span>
       <span class="val" id="v-${key}"></span>
       ${btn(key + '-', pre + down, '−')}
     </div>`).join('');
document.getElementById('knobs').innerHTML = knobGrid(KNOBS, GROUPS, '');
document.getElementById('sknobs').innerHTML = knobGrid(SKNOBS, SGROUPS, '⇧');

// ④ 鍵盤（2オクターブ）：1鍵＝2マス。黒鍵は白鍵の間に半鍵ずらして置く
//   [Oct−][白鍵15個][Oct＋] = 34マス
{
  const isBlack = s => [1, 3, 6, 8, 10].includes(s % 12);
  const pk = (id, cls, row, col, key) =>
    `<button class="pk ${cls}" data-pk="${id}" style="grid-row:${row};grid-column:${col}/span 2"><kbd>${key}</kbd><span></span></button>`;
  let html = pk('A', 'oct', 2, 1, 'A'), wi = 0;
  for (let s = 0; s <= 24; s++) {
    const key = s <= 12 ? KEY_OF_SEMI[s] : '';      // PCキーは下の1オクターブだけ
    if (isBlack(s)) html += pk(s, 'black', 1, 3 + 2 * (wi - 1) + 1, key);
    else html += pk(s, 'white', 2, 3 + 2 * wi++, key);
  }
  html += pk(';', 'oct', 2, 3 + 2 * wi, ';');
  document.getElementById('piano').innerHTML = html;
}
document.querySelectorAll('[data-pk]').forEach(b => {
  const k = b.dataset.pk;
  b.onpointerdown = () => { pianoDown(k); render(); };
  b.onpointerup = b.onpointerleave = () => { pianoUp(k); render(); };
});

// ショートカット一覧
document.getElementById('help').innerHTML =
  TRANSPORT.map(([k, , n]) => `<div>${k}：${n}</div>`).join('') +
  `<div>Space：再生/停止</div><div>Shift+P / ;：テンポ</div>
   <div>${TRACK_KEYS.join(' ')}：トラック選択</div><div>6：トラックON/OFF</div><div>7：音階</div><div>BS：録音消去</div>` +
  SWITCHES.filter(s => s !== '|').map(([k, , n]) => `<div>${k.replace('⇧', 'Shift+')}：${n}</div>`).join('') +
  KNOBS.map(([, n, u, d]) => `<div>${u} / ${d}：${n}</div>`).join('') +
  SKNOBS.map(([, n, u, d]) => `<div>Shift+${u} / ${d}：${n}</div>`).join('') +
  `<div>演奏モード中：S〜L 白鍵、E R Y U I 黒鍵、A / ; オクターブ</div>`;

function render() {
  const tr = cur();
  const fmt = (v, u) => (v < 10 ? v.toFixed(2) : Math.round(v)) + ' ' + u;
  const set = (id, s) => { const e = document.getElementById(id); if (e) e.textContent = s; };
  const on = (act, b) => document.querySelectorAll(`[data-act="${act}"]`).forEach(e => e.classList.toggle('on', b));
  document.querySelectorAll('.h-track').forEach(e => e.textContent = `トラック${st.sel + 1}・${MODES[tr.mode]}`);

  // ① 再生バー
  set('t-play', st.playing ? '再生中' : '停止'); on('play', st.playing);
  set('t-rec', st.rec ? '録音中' : ''); on('rec', st.rec);
  set('t-tempo', st.tempo + ' BPM');
  set('t-bars', BARS[st.bars] + '小節'); set('t-quant', QUANTS[st.quant][0]);
  set('t-pmode', st.playMode ? 'ON' : ''); on('pmode', st.playMode);

  // ③ 音色
  [...KNOBS, ...SKNOBS].forEach(([key, , , , , , , , unit]) => set('v-' + key, fmt(tgt(key)[key], unit)));
  set('v-root', NOTE_NAMES[tr.root]); set('v-oct', tr.oct);
  [0, 1, 2, 3].forEach(i => on('v' + i, tr.voices[i]));
  set('t-wave', WAVES[tr.wave]);
  set('t-mono', tr.mono ? '単音' : '和音'); on('mono', tr.mono);
  set('t-arp', ARPS[tr.arp]); on('arp', tr.arp > 0);
  set('t-arpRate', ARP_RATES[tr.arpRate][0]);

  // ② トラック見出し
  tracks.forEach((t, i) => {
    document.getElementById('th-' + i).classList.toggle('sel', i === st.sel);
    on('sel' + i, t.on);
    const k6 = i === st.sel ? '<kbd>6</kbd>' : '', k7 = i === st.sel ? '<kbd>7</kbd>' : '';   // 選択中だけキー表示
    document.getElementById('tm-' + i).innerHTML = `${k7}${MODES[t.mode]}・${NOTE_NAMES[t.root]}${t.oct}`;
    const b = document.getElementById('tb-' + i);
    b.innerHTML = k6 + (t.on ? 'ON' : 'OFF'); b.classList.toggle('on', t.on);
    document.getElementById('tv-' + i).style.width = (t.volume * 100) + '%';
  });

  // ④ 鍵盤：ドローンのときは隠す
  document.getElementById('pianoSec').style.display = tr.mode ? '' : 'none';
  set('h-pmode', st.playMode ? '演奏モード中（Tab で戻る）' : 'Tab で演奏モード');
  set('v-poct', 'オクターブ ' + st.playOct);
  document.querySelectorAll('[data-pk]').forEach(b => {
    const k = b.dataset.pk, d = descFor(k, tr);
    b.querySelector('span').textContent = k === 'A' ? 'Oct−' : k === ';' ? 'Oct＋' : d ? labelOf(d) : '';
    b.classList.toggle('down', !!held[k]);
  });
}

// ② トラック＋録音内容（横棒の長さ＝音の長さ）
let editing = false;
function renderTimeline() {
  if (editing) return;
  const Lb = loopBeats();
  const grid = `repeating-linear-gradient(90deg, #3a3a44 0 1px, transparent 1px ${100 / BARS[st.bars]}%),
                repeating-linear-gradient(90deg, #1e1e26 0 1px, transparent 1px ${100 / Lb}%)`;
  document.getElementById('trackArea').innerHTML = tracks.map((tr, ti) => {
    const lanes = [];                                // 重なる音は段をずらす
    const bars = tr.events.map((ev, ei) => {
      if (ev.pos >= Lb) return '';
      let lane = lanes.findIndex(end => end <= ev.pos + 1e-6);
      if (lane < 0) lane = lanes.length;
      lanes[lane] = ev.pos + ev.dur;
      const w = Math.min(ev.dur, Lb - ev.pos);
      return `<div class="ev" style="left:${ev.pos / Lb * 100}%;width:${w / Lb * 100}%;top:${2 + lane * 22}px" title="${labelOf(ev)}">
                <span contenteditable="true" data-t="${ti}" data-e="${ei}">${labelOf(ev)}</span></div>`;
    }).join('');
    return `<div class="trow">
      <div class="thead" id="th-${ti}" data-sel="${ti}">
        ${btn('sel' + ti, TRACK_KEYS[ti], '')}
        <span class="tname">トラック${ti + 1}</span>
        <span class="tinfo">
          <button class="badge" data-act="on${ti}" id="tb-${ti}"></button>
          <button class="badge mode" data-act="mode${ti}" id="tm-${ti}"></button>
        </span>
        <div class="meter"><i id="tv-${ti}"></i></div>
      </div>
      <div class="tl" style="height:${Math.max(2, lanes.length) * 22 + 4}px;background-image:${grid}">${bars}<div class="ph"></div></div>
    </div>`;
  }).join('');

  document.querySelectorAll('.thead').forEach(h => h.onclick = () => run('sel' + h.dataset.sel));
  document.querySelectorAll('.ev span').forEach(sp => {
    sp.onfocus = () => editing = true;
    sp.onkeydown = e => { if (e.key === 'Enter') { e.preventDefault(); sp.blur(); } };
    sp.onblur = () => {
      editing = false;
      const tr = tracks[sp.dataset.t], ev = tr.events[sp.dataset.e], text = sp.textContent.trim();
      if (!text) { tr.events.splice(sp.dataset.e, 1); save(); renderTimeline(); return; }   // 空なら削除
      const p = ev.kind === 'chord'
        ? parseChord(text, ev.oct) || parseNote(text, ev.oct)
        : parseNote(text, ev.oct) || parseChord(text, ev.oct);
      if (!p) {                                      // 読めない表記は元に戻す
        sp.parentNode.classList.add('bad');
        setTimeout(renderTimeline, 600);
        return;
      }
      delete ev.semi; delete ev.root; delete ev.q;
      Object.assign(ev, p);
      save(); renderTimeline();
    };
  });
  render();
}

// 再生位置の表示
function tick() {
  const Lb = loopBeats();
  if (ac && st.playing) {
    const p = (((ac.currentTime - st.loopStart) / beatSec()) % Lb + Lb) % Lb;
    document.querySelectorAll('.ph').forEach(e => e.style.left = (p / Lb * 100) + '%');
    document.getElementById('pos').textContent = `${Math.floor(p / 4) + 1}.${Math.floor(p % 4) + 1}`;
  } else document.getElementById('pos').textContent = '1.1';
  document.getElementById('lcdsub').textContent = `小節.拍　／ ${BARS[st.bars]}小節ループ`;
  requestAnimationFrame(tick);
}

// ===== キーボード操作 =====
document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (b) { e.stopPropagation(); run(b.dataset.act); }
}, true);

document.addEventListener('keydown', e => {
  if (e.target.isContentEditable) return;           // 文字を書き換えている間は無視
  if (e.shiftKey && SHIFTMAP[e.code]) {             // Shift + キー（演奏モード中でも効く）
    e.preventDefault();
    if (!e.repeat || /[+-]$/.test(SHIFTMAP[e.code])) run(SHIFTMAP[e.code]);
    return;
  }
  const k = keyOf(e.code);
  // 演奏モード中：英字キーは鍵盤（トラック選択 Z〜N は残す）
  if (st.playMode && k && !TRACK_KEYS.includes(k)) {
    e.preventDefault();
    const id = pcToId(k);
    if (id && !e.repeat) { pianoDown(id); render(); save(); }
    return;
  }
  const act = KEYMAP[e.code];
  if (!act || e.repeat && !/[+-]$/.test(act)) return;
  e.preventDefault(); run(act);
});
document.addEventListener('keyup', e => {
  if (e.target.isContentEditable) return;
  const id = keyOf(e.code) && pcToId(keyOf(e.code));
  if (id && held[id]) { pianoUp(id); render(); }
});

renderTimeline(); tick();
</script>
