<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Drone Synthesizer</title>
<style>
  body { margin: 0; background: #0d0d0f; color: #ddd; font-family: system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 20px; letter-spacing: .1em; color: #e8b86a; }
  section { border: 1px solid #2a2a30; border-radius: 8px; padding: 12px; margin-bottom: 12px; overflow-x: auto; }
  h2 { font-size: 13px; color: #888; margin: 0 0 8px; }

  /* キーボードと同じ並び：10列 */
  .grid { display: grid; grid-template-columns: repeat(10, minmax(72px, 1fr)); gap: 6px; }
  .col { display: flex; flex-direction: column; gap: 4px; text-align: center; }
  .col.empty { opacity: .25; }
  .name { font-size: 12px; color: #aaa; }
  .val { font-size: 13px; color: #e8b86a; font-variant-numeric: tabular-nums; min-height: 1.2em; }

  button { background: #1c1c22; color: #ddd; border: 1px solid #3a3a44; border-radius: 6px;
           padding: 8px 4px; font-size: 14px; cursor: pointer; }
  button:disabled { cursor: default; }
  button.on { background: #6b4a1a; border-color: #e8b86a; }
  button.flash { background: #e8b86a; color: #000; }
  kbd { display: block; font-size: 15px; font-weight: bold; color: #fff; }
  button.flash kbd { color: #000; }
  #help { display: none; font-size: 13px; color: #aaa; margin-top: 8px; }
  #help.show { display: block; }
</style>
</head>
<body>
<main>
  <h1>DRONE SYNTHESIZER</h1>

  <section>
    <h2>切替</h2>
    <div class="grid" id="toggles"></div>
    <div id="help"></div>
  </section>

  <section>
    <h2>つまみ（上キー＝上げる／下キー＝下げる）</h2>
    <div class="grid" id="knobs"></div>
  </section>
</main>

<script>
// ===== 設定 =====
const NOTE_NAMES = ['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];
const WAVES = ['sawtooth','triangle','square','sine'];
const VOICE_RATIOS = [0.5, 1, 1.5, 2];          // 低音・基音・5度・オクターブ

// 切替: [数字キー, 操作名, 表示名]（キーボードの並び順。操作名なし＝空き）
const TOGGLES = [
  ['1', 'v0',   '低音'],
  ['2', 'v1',   '基音'],
  ['3', 'v2',   '5度'],
  ['4', 'v3',   'オクターブ'],
  ['5', 'wave', '波形'],
  ['6'], ['7'], ['8'],
  ['9', 'help', '一覧'],
  ['0', 'play', '再生/停止'],
];

// つまみ: [キー名, 表示名, 上げるキー, 下げるキー, 最小, 最大, 初期値, 1回の変化量, 単位]
// 変化量が 1より大きく2未満 → 掛け算で変化（周波数系）。キー名なし＝空き
const KNOBS = [
  ['root',   '基音',        'Q', 'A', 0,   11,   2,    1,    ''],
  ['oct',    'オクターブ',  'W', 'S', 0,   5,    2,    1,    ''],
  ['cutoff', 'フィルター',  'E', 'D', 60,  8000, 900,  1.15, 'Hz'],
  ['reso',   '共鳴',        'R', 'F', 0,   25,   4,    1,    ''],
  ['detune', 'うなり',      'T', 'G', 0,   30,   7,    1,    'cent'],
  ['lfoRate','揺れ速さ',    'Y', 'H', 0.02,5,    0.1,  1.3,  'Hz'],
  ['lfoAmt', '揺れ深さ',    'U', 'J', 0,   3000, 400,  100,  'Hz'],
  ['reverb', '残響',        'I', 'K', 0,   1,    0.5,  0.05, ''],
  ['volume', '音量',        'O', 'L', 0,   1,    0.5,  0.05, ''],
  ['',       '',            'P', ';'],
];

// ===== 状態 =====
const st = { playing: false, wave: 0, voices: [true, true, true, false] };
KNOBS.forEach(k => { if (k[0]) st[k[0]] = k[6]; });

// ===== 音の仕組み =====
let ac, filter, lfo, lfoGain, dry, wet, master, voices = [];

function makeReverb() {
  const len = ac.sampleRate * 5, buf = ac.createBuffer(2, len, ac.sampleRate);
  for (let c = 0; c < 2; c++) {
    const d = buf.getChannelData(c);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3);
  }
  const conv = ac.createConvolver(); conv.buffer = buf; return conv;
}

function setupAudio() {
  ac = new AudioContext();
  filter = ac.createBiquadFilter(); filter.type = 'lowpass';
  lfo = ac.createOscillator(); lfoGain = ac.createGain();
  lfo.connect(lfoGain).connect(filter.frequency); lfo.start();
  dry = ac.createGain(); wet = ac.createGain(); master = ac.createGain();
  master.gain.value = 0;
  const rev = makeReverb();
  filter.connect(dry).connect(master);
  filter.connect(rev).connect(wet).connect(master);
  master.connect(ac.destination);

  voices = VOICE_RATIOS.map(() => {
    const g = ac.createGain(); g.gain.value = 0; g.connect(filter);
    const oscs = [0, 1].map(() => { const o = ac.createOscillator(); o.connect(g); o.start(); return o; });
    return { g, oscs };
  });
  applyAll();
}

function baseFreq() { return 440 * Math.pow(2, (st.root + 12 * (st.oct + 1) - 69) / 12); }

function applyAll() {
  if (!ac) return;
  const t = ac.currentTime, f = baseFreq();
  voices.forEach((v, i) => {
    v.oscs.forEach((o, j) => {
      o.type = WAVES[st.wave];
      o.frequency.setTargetAtTime(f * VOICE_RATIOS[i], t, 0.3);   // ゆっくり音程移動
      o.detune.setTargetAtTime(j ? st.detune : -st.detune, t, 0.1);
    });
    v.g.gain.setTargetAtTime(st.voices[i] ? 0.2 : 0, t, 0.8);      // ふわっと出入り
  });
  filter.frequency.setTargetAtTime(st.cutoff, t, 0.1);
  filter.Q.setTargetAtTime(st.reso, t, 0.1);
  lfo.frequency.setTargetAtTime(st.lfoRate, t, 0.1);
  lfoGain.gain.setTargetAtTime(st.lfoAmt, t, 0.1);
  dry.gain.setTargetAtTime(1 - st.reverb * 0.7, t, 0.1);
  wet.gain.setTargetAtTime(st.reverb * 1.5, t, 0.1);
  master.gain.setTargetAtTime(st.playing ? st.volume : 0, t, st.playing ? 1 : 0.5);
}

// ===== 操作 =====
const ACTIONS = {
  play()  { if (!ac) setupAudio(); st.playing = !st.playing; ac.resume(); },
  wave()  { st.wave = (st.wave + 1) % WAVES.length; },
  help()  { document.getElementById('help').classList.toggle('show'); },
};
[0, 1, 2, 3].forEach(i => ACTIONS['v' + i] = () => st.voices[i] = !st.voices[i]);

KNOBS.forEach(([key, , , , min, max, , step]) => {
  if (!key) return;
  const mul = step > 1 && step < 2;
  ACTIONS[key + '+'] = () => st[key] = Math.min(max, mul ? st[key] * step : st[key] + step);
  ACTIONS[key + '-'] = () => st[key] = Math.max(min, mul ? st[key] / step : st[key] - step);
});
// 基音は B の次が C に戻る（ぐるっと一周）
ACTIONS['root+'] = () => st.root = (st.root + 1) % 12;
ACTIONS['root-'] = () => st.root = (st.root + 11) % 12;

// キー → 操作
const KEYMAP = { Space: 'play' };
TOGGLES.forEach(([k, act]) => { if (act) KEYMAP['Digit' + k] = act; });
const codeOf = k => k === ';' ? 'Semicolon' : 'Key' + k;
KNOBS.forEach(([key, , up, down]) => { if (key) { KEYMAP[codeOf(up)] = key + '+'; KEYMAP[codeOf(down)] = key + '-'; } });

function run(act) {
  ACTIONS[act](); applyAll(); render();
  const b = document.querySelector(`[data-act="${act}"]`);
  if (b) { b.classList.add('flash'); setTimeout(() => b.classList.remove('flash'), 120); }
}

// ===== 画面（縦に要素、横にキー順） =====
const btn = (act, key, label) =>
  `<button ${act ? `data-act="${act}"` : 'disabled'}><kbd>${key}</kbd>${label}</button>`;

document.getElementById('toggles').innerHTML = TOGGLES.map(([key, act, name]) =>
  `<div class="col${act ? '' : ' empty'}">
     ${btn(act, key, name || '')}
     <span class="val" id="t-${act}"></span>
   </div>`).join('');

document.getElementById('knobs').innerHTML = KNOBS.map(([key, name, up, down]) =>
  `<div class="col${key ? '' : ' empty'}">
     ${btn(key && key + '+', up, '＋')}
     <span class="name">${name || '空き'}</span>
     <span class="val" id="v-${key}"></span>
     ${btn(key && key + '-', down, '−')}
   </div>`).join('');

// ショートカット一覧
document.getElementById('help').innerHTML =
  TOGGLES.filter(t => t[1]).map(([k, , n]) => `<div>${k}：${n}</div>`).join('') +
  KNOBS.filter(k => k[0]).map(([, n, u, d]) => `<div>${u} / ${d}：${n}</div>`).join('') +
  '<div>Space：再生/停止</div>';

function render() {
  const fmt = (v, u) => (v < 10 ? v.toFixed(2) : Math.round(v)) + ' ' + u;
  KNOBS.forEach(([key, , , , , , , , unit]) => { if (key) document.getElementById('v-' + key).textContent = fmt(st[key], unit); });
  document.getElementById('v-root').textContent = NOTE_NAMES[st.root];
  document.getElementById('v-oct').textContent = st.oct;
  document.getElementById('t-wave').textContent = WAVES[st.wave];
  document.getElementById('t-play').textContent = st.playing ? '再生中' : '停止';
  [0, 1, 2, 3].forEach(i => document.querySelector(`[data-act="v${i}"]`).classList.toggle('on', st.voices[i]));
  document.querySelector('[data-act="play"]').classList.toggle('on', st.playing);
}

document.querySelectorAll('[data-act]').forEach(b => b.onclick = () => run(b.dataset.act));
document.addEventListener('keydown', e => {
  const act = KEYMAP[e.code];
  if (!act || e.repeat && act === 'play') return;
  e.preventDefault(); run(act);
});
render();
</script>
</body>
</html>
